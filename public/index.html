<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FAOne — BDF Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">BEIERSDORF</span>
      <span class="brand-sub">Billing &amp; Tracker Console</span>
    </div>
    <nav class="side-nav">
      <button class="side-btn active" data-tab="dashboard"><span class="side-icon">◧</span> Dashboard</button>
      <button class="side-btn" data-tab="country-view"><span class="side-icon">⚲</span> Country View</button>
      <button class="side-btn" data-tab="tracker"><span class="side-icon">☰</span> Q3 Tracker</button>
      <button class="side-btn" data-tab="po-tracker"><span class="side-icon">▤</span> PO Tracker</button>
      <button class="side-btn" data-tab="user-counts"><span class="side-icon">◈</span> User Counts</button>
      <button class="side-btn" data-tab="one-time"><span class="side-icon">◇</span> One-time &amp; Support</button>
      <button class="side-btn" data-tab="reconciliation"><span class="side-icon">⇄</span> Billing Reconciliation</button>
      <button class="side-btn" data-tab="milestones"><span class="side-icon">◔</span> Milestone Calendar</button>
      <button class="side-btn" data-tab="carryover"><span class="side-icon">↺</span> Q2 Carry-over</button>
      <button class="side-btn" data-tab="issues"><span class="side-icon">⚑</span> Open Issues</button>
      <button class="side-btn" data-tab="settings"><span class="side-icon">⚙</span> Settings</button>
    </nav>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="page-title">Dashboard</h1>
        <p id="page-subtitle">Beiersdorf × FieldAssist — FAOne billing snapshot &amp; KPIs</p>
      </div>
      <div class="topbar-right">
        <div class="quarter-switcher">
          <select id="global-quarter-select"></select>
          <button id="global-add-quarter-btn" title="Add a new quarter">+ Quarter</button>
          <div id="add-quarter-popover" class="add-quarter-popover hidden">
            <label>Label</label>
            <input id="new-q-label" placeholder="e.g. Q4 FY26 (OND 26)">
            <label>Start date</label>
            <input id="new-q-start" type="date">
            <button id="confirm-add-quarter-btn" class="add-btn">Create Quarter</button>
          </div>
        </div>
        <span id="user-badge"></span>
        <button id="export-btn">⬇ Export to Excel</button>
      </div>
    </header>

    <main id="content" class="content"></main>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
