<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>FAOne — BDF Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/styles.css" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">NIVEA</span>
      <span class="brand-sub">FAOne — BDF Tracker</span>
    </div>
    <div class="topbar-right">
      <span id="quarter-badge"></span>
      <span id="user-badge"></span>
      <button id="export-btn">Export to Excel</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
    <button class="tab-btn" data-tab="tracker">Q3 Tracker</button>
    <button class="tab-btn" data-tab="milestones">Milestone Calendar</button>
    <button class="tab-btn" data-tab="email">Weekly Status Email</button>
    <button class="tab-btn" data-tab="carryover">Q2 Carry-over</button>
    <button class="tab-btn" data-tab="issues">Open Issues</button>
  </nav>

  <main id="content" class="content"></main>
</div>

<script src="/app.js"></script>
</body>
</html>
